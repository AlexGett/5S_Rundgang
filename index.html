	<script>
		let db, currentPerformer=null, currentReason=null, currentPhoto=null, currentResponsible=null, currentDueDate=null, entryToRemove=null, editingEntryId=null, currentFilter='all', deleteAllMode=false;
		const DB_NAME='5sInspectionDB', DB_VERSION=1, STORE_NAME='entries', IMAGE_PATH='N:/BMW U1x/5S_Rundgang';
		const confirmationModal=document.getElementById('confirmationModal'), confirmYesButton=document.getElementById('confirmYes'), confirmNoButton=document.getElementById('confirmNo');
		const entriesList=document.getElementById('entriesList'), blockedBySelect=document.getElementById('blockedBySelect'), blockedByTextInput=document.getElementById('blockedByTextInput'), nameErrorMessage=document.getElementById('nameErrorMessage');
		const customReasonInput=document.getElementById('customReasonInput'), customReasonErrorMessage=document.getElementById('customReasonErrorMessage');
		const printAndSaveButton=document.getElementById('printAndSaveButton'), videoElement=document.getElementById('videoElement'), canvasElement=document.getElementById('canvasElement');
		const takePhotoButton=document.getElementById('takePhotoButton'), retakePhotoButton=document.getElementById('retakePhotoButton'), responsibleSelect=document.getElementById('responsibleSelect'), responsibleTextInput=document.getElementById('responsibleTextInput');
		const dueDateInput=document.getElementById('dueDateInput'), dueDateDisplay=document.getElementById('dueDateDisplay'), dueDateErrorMessage=document.getElementById('dueDateErrorMessage'), printPreviewContent=document.getElementById('printPreviewContent');
		const context=canvasElement.getContext('2d');
		let stream=null;

		document.addEventListener('DOMContentLoaded', async () => {
			await initDB(); loadPerformerFromStorage(); await loadEntries(); updatePrintPreview();
			document.getElementById('exportJsonButton').addEventListener('click', exportJsonHandler);
			document.getElementById('importJsonButton').addEventListener('click', () => document.getElementById('importJsonInput').click());
			document.getElementById('importJsonInput').addEventListener('change', importJsonHandler);
			document.getElementById('deleteAllButton').addEventListener('click', deleteAllEntriesHandler);
			
			// Service Worker Registrierung und Versionsanzeige
			if ('serviceWorker' in navigator) {
				const getVersion = () => {
					if (navigator.serviceWorker.controller) {
						console.log('Frage Version vom Controller an...');
						navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' });
					}
				};

				navigator.serviceWorker.register('./service-worker.js').then(registration => {
					console.log('Service Worker Registrierung erfolgreich.');
					// Lauschen, ob ein neuer Worker installiert wird
					registration.addEventListener('updatefound', () => {
						const newWorker = registration.installing;
						newWorker.addEventListener('statechange', () => {
							// Wenn der neue Worker aktiviert ist und die Seite kontrolliert
							if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
								getVersion();
							}
						});
					});
				});

				navigator.serviceWorker.ready.then(getVersion); // Version abfragen, sobald der SW bereit ist
				navigator.serviceWorker.addEventListener('controllerchange', getVersion); // Version abfragen, wenn ein neuer SW die Kontrolle übernimmt
			}
			navigator.serviceWorker.addEventListener('message', event => { if (event.data && event.data.type === 'VERSION') { document.getElementById('version-display').textContent = `Version ${event.data.version}`; } });
		});

		async function initDB() { return new Promise((res, rej) => { const req = indexedDB.open(DB_NAME, DB_VERSION); req.onupgradeneeded = e => { db=e.target.result; if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, {keyPath:'id', autoIncrement:true}); }; req.onsuccess = e => { db=e.target.result; res(); }; req.onerror = e => rej(e.target.errorCode); }); }
		async function addEntry(entry) { return new Promise((res, rej) => { const tx=db.transaction([STORE_NAME], 'readwrite'); const req=tx.objectStore(STORE_NAME).add(entry); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
		async function updateEntry(id, upd) { return new Promise((res, rej) => { const store=db.transaction([STORE_NAME], 'readwrite').objectStore(STORE_NAME); const req=store.get(id); req.onsuccess=e=>{ const ent=e.target.result; if(ent){ store.put({id:ent.id, timestamp:ent.timestamp, performer:upd.performer, reason:upd.reason, photo:upd.photo, responsible:upd.responsible, dueDate:upd.dueDate}).onsuccess=()=>res(); }else rej('Not found'); }; }); }
		async function deleteEntry(id) { return new Promise((res, rej) => { const req=db.transaction([STORE_NAME], 'readwrite').objectStore(STORE_NAME).delete(id); req.onsuccess=()=>res(); req.onerror=()=>rej(req.error); }); }
		async function getAllEntries() { return new Promise((res, rej) => { const req=db.transaction([STORE_NAME], 'readonly').objectStore(STORE_NAME).getAll(); req.onsuccess=()=>res(req.result); }); }

		function savePerformerToStorage() { localStorage.setItem('currentPerformer', currentPerformer); }
		function loadPerformerFromStorage() { const s=localStorage.getItem('currentPerformer'); if(s){ currentPerformer=s; if(Array.from(blockedBySelect.options).map(o=>o.value).includes(s)) blockedBySelect.value=s; else blockedByTextInput.value=s; hideAllPanels(); showPhotoSelectionPanel(); }else showNamePanel(); }
		function endSession() { localStorage.removeItem('currentPerformer'); currentPerformer=null; blockedBySelect.value=''; blockedByTextInput.value=''; hideAllPanels(); showNamePanel(); }
		function hideAllPanels() { ['namePanel','photoPanel','reasonPanel','customReasonPanel','actionSelectionPanel','photoSelectionPanel'].forEach(id=>document.getElementById(id).style.display='none'); dueDateInput.style.display='none'; try { if (document.fullscreenElement) document.exitFullscreen(); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {} }
		function showNamePanel() { hideAllPanels(); document.getElementById('namePanel').style.display='block'; nameErrorMessage.style.display='none'; editingEntryId=null; printAndSaveButton.textContent='Speichern & Abschließen'; currentPhoto=null; currentReason=null; currentResponsible=null; currentDueDate=null; responsibleSelect.value=''; responsibleTextInput.value=''; dueDateInput.value=''; dueDateDisplay.textContent='Datum: Keine Auswahl'; customReasonInput.value=''; document.querySelectorAll('.reason-buttons button').forEach(b=>b.classList.remove('active-btn')); updatePrintPreview(); stopCamera(); }
		function showPhotoSelectionPanel() { const p=blockedByTextInput.value.trim()||blockedBySelect.value.trim(); if(!p){ nameErrorMessage.textContent="Name fehlt!"; nameErrorMessage.style.display='block'; return;} nameErrorMessage.style.display='none'; if(p!==currentPerformer){ currentPerformer=p; savePerformerToStorage(); } hideAllPanels(); document.getElementById('photoSelectionPanel').style.display='block'; updatePrintPreview(); }
		function showActionSelectionPanel() { if(currentReason && currentReason!=='Sonstiges'){ hideAllPanels(); document.getElementById('actionSelectionPanel').style.display='block'; updatePrintPreview(); return; } const r=customReasonInput.value.trim(); if(!r){ customReasonErrorMessage.style.display='block'; return; } customReasonErrorMessage.style.display='none'; hideAllPanels(); document.getElementById('actionSelectionPanel').style.display='block'; updatePrintPreview(); }
		function showPreviousReasonPanel() { if(currentReason==='Sonstiges'||customReasonInput.value.trim()!==''){ hideAllPanels(); document.getElementById('customReasonPanel').style.display='block'; }else{ hideAllPanels(); document.getElementById('reasonPanel').style.display='block'; } updatePrintPreview(); }

		async function showPhotoPanel(src) { hideAllPanels(); document.getElementById('photoPanel').style.display='block'; if(src==='camera'){ try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch(e) {} context.clearRect(0,0,canvasElement.width,canvasElement.height); canvasElement.style.display='none'; currentPhoto=null; try{ if (!stream || !stream.active) { stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width: {ideal: 1280}, height: {ideal: 720}, aspectRatio: {ideal: 1.777777778}}}); } videoElement.srcObject=stream; videoElement.style.display='block'; takePhotoButton.style.display='block'; retakePhotoButton.style.display='none'; }catch(e){ alert("Kamerafehler!"); videoElement.style.display='none'; takePhotoButton.style.display='none'; } }else{ videoElement.style.display='none'; takePhotoButton.style.display='none'; retakePhotoButton.style.display='none'; currentPhoto=null; } updatePrintPreview(); }
		function handleUploadedPhoto(e) { const file=e.target.files[0]; if(file){ const reader=new FileReader(); reader.onload=function(ev){ const img=new Image(); img.onload=function(){ let w=img.width, h=img.height; const r=Math.min(1024/w, 768/h); if(w>1024||h>768){w*=r; h*=r;} canvasElement.width=w; canvasElement.height=h; context.drawImage(img,0,0,w,h); currentPhoto=canvasElement.toDataURL('image/jpeg', 0.8); hideAllPanels(); document.getElementById('reasonPanel').style.display='block'; updatePrintPreview(); }; img.src=ev.target.result; }; reader.readAsDataURL(file); } }
		function takeSnapshot() { if(!stream||videoElement.videoWidth===0) return; canvasElement.width=videoElement.videoWidth; canvasElement.height=videoElement.videoHeight; context.drawImage(videoElement,0,0,canvasElement.width,canvasElement.height); currentPhoto=canvasElement.toDataURL('image/jpeg',0.8); videoElement.style.display='none'; canvasElement.style.display='block'; takePhotoButton.style.display='none'; retakePhotoButton.style.display='block'; hideAllPanels(); document.getElementById('reasonPanel').style.display='block'; updatePrintPreview(); }
		function stopCamera() { if(stream){ stream.getTracks().forEach(t=>t.stop()); videoElement.srcObject=null; stream=null; } }
		takePhotoButton.addEventListener('click', takeSnapshot);
		retakePhotoButton.addEventListener('click', async () => { currentPhoto=null; canvasElement.style.display='none'; try{ if (!stream || !stream.active) { stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width: {ideal: 1280}, height: {ideal: 720}, aspectRatio: {ideal: 1.777777778}}}); } videoElement.srcObject=stream; videoElement.style.display='block'; takePhotoButton.style.display='block'; retakePhotoButton.style.display='none'; }catch(e){} hideAllPanels(); document.getElementById('photoPanel').style.display='block'; updatePrintPreview(); });

		function handleReasonSelection(r) { currentReason=r; document.querySelectorAll('.reason-buttons button').forEach(b=>{ if(b.textContent===r) b.classList.add('active-btn'); else b.classList.remove('active-btn'); }); if(r==='Sonstiges') showCustomReasonPanelFromReason(); else updatePrintPreview(); }
		function showCustomReasonPanelFromReason() { hideAllPanels(); document.getElementById('customReasonPanel').style.display='block'; customReasonInput.focus(); customReasonErrorMessage.style.display='none'; if(currentReason!=='Sonstiges') currentReason='Sonstiges'; updatePrintPreview(); }

		function formatDate(date) { const d=new Date(date); return [('0'+d.getDate()).slice(-2), ('0'+(d.getMonth()+1)).slice(-2), d.getFullYear()].join('.'); }
		function calculateNextWeekFriday() { const t=new Date(); const d=(5+7-t.getDay())%7; t.setDate(t.getDate() + (t.getDay()===5 ? 7 : (t.getDay()>5 ? d+7 : 5-t.getDay()+7))); return t.toISOString().substring(0,10); }
		function handleDateChange(date) { if(date){ currentDueDate=date; dueDateDisplay.textContent='Datum: '+formatDate(date); dueDateErrorMessage.style.display='none'; document.querySelectorAll('.due-date-buttons button').forEach(b=>b.classList.remove('active-btn')); document.querySelector('.due-date-buttons button:nth-child(3)').classList.add('active-btn'); }else{ currentDueDate=null; dueDateDisplay.textContent='Datum: Keine Auswahl'; } updatePrintPreview(); }
		function getWeekNumber(d) { d=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7)); return Math.ceil((((d-new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000)+1)/7); }
		function handleDueDateSelection(t) { document.querySelectorAll('.due-date-buttons button').forEach(b=>b.classList.remove('active-btn')); dueDateInput.style.display='none'; dueDateInput.value=''; let ds='Keine Auswahl'; currentDueDate=null; if(t==='immediate'){ currentDueDate='Sofort'; ds='Sofort'; document.querySelector('.due-date-buttons button:nth-child(1)').classList.add('active-btn'); }else if(t==='next_week_friday'){ const c=calculateNextWeekFriday(); currentDueDate=c; ds=`Fr. KW ${getWeekNumber(new Date(c+'T12:00:00'))} (${new Date(c+'T12:00:00').toLocaleDateString('de-DE')})`; document.querySelector('.due-date-buttons button:nth-child(2)').classList.add('active-btn'); }else if(t==='date_picker'){ dueDateInput.style.display='block'; document.querySelector('.due-date-buttons button:nth-child(3)').classList.add('active-btn'); if(dueDateInput.value){ currentDueDate=dueDateInput.value; ds=formatDate(currentDueDate); }else ds='Datum auswählen...'; } dueDateDisplay.textContent='Datum: '+ds; dueDateErrorMessage.style.display='none'; updatePrintPreview(); }

		async function handlePrintAndSave() {
			const p=blockedByTextInput.value.trim()||blockedBySelect.value.trim()||currentPerformer;
			let r=customReasonInput.value.trim()||currentReason;
			const resp=responsibleTextInput.value.trim()||responsibleSelect.value.trim()||'';
			let dd=currentDueDate;
			if(currentReason==='Sonstiges'&&!customReasonInput.value.trim()){ customReasonErrorMessage.style.display='block'; return; }
			if(currentReason!=='Sonstiges'){ customReasonInput.value=''; r=currentReason; }
			if(!dd){ dueDateErrorMessage.style.display='block'; return; }
			if(!p||!r) return alert("Pflichtfelder fehlen!");
			if(dueDateInput.style.display==='block'&&dueDateInput.value) dd=dueDateInput.value;
			if(dd==='Sofort') dd=new Date().toISOString().substring(0,10);
			
			const entryData = { performer:p, reason:r, photo:currentPhoto, responsible:resp, dueDate:dd, timestamp:new Date().toISOString() };
			if(editingEntryId) await updateEntry(editingEntryId, entryData); else await addEntry(entryData);
			
			currentReason=null; currentPhoto=null; currentResponsible=null; currentDueDate=null; customReasonInput.value=''; responsibleSelect.value=''; responsibleTextInput.value=''; dueDateInput.value=''; dueDateDisplay.textContent='Datum: Keine Auswahl'; document.querySelectorAll('.due-date-buttons button').forEach(b=>b.classList.remove('active-btn')); dueDateInput.style.display='none'; dueDateErrorMessage.style.display='none';
			await loadEntries(); hideAllPanels(); showPhotoSelectionPanel(); editingEntryId=null; printAndSaveButton.textContent='Speichern & Abschließen'; updatePrintPreview(); stopCamera();
		}

		function appendEntryToDOM(ent) {
			const dt=new Date(ent.timestamp).toLocaleString('de-DE', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
			let dd='N/A';
			if(ent.dueDate){ const td=new Date().toISOString().substring(0,10); if(ent.dueDate===td) dd='Sofort'; else if(ent.dueDate===calculateNextWeekFriday()) dd=`Fr. KW ${getWeekNumber(new Date(ent.dueDate+'T12:00:00'))} (${formatDate(ent.dueDate)})`; else dd=formatDate(ent.dueDate); }
			const div=document.createElement('div'); div.className='entry-item info'; div.setAttribute('data-id', ent.id); div.setAttribute('data-performer', ent.performer); div.setAttribute('data-reason', ent.reason); div.setAttribute('data-photo', ent.photo||''); div.setAttribute('data-responsible', ent.responsible||''); div.setAttribute('data-duedate', ent.dueDate||'');
			div.innerHTML = `<div class="entry-info"><div class="entry-timestamp">${dt}</div><strong>Von:</strong> ${ent.performer}<br><strong>Aufgabe:</strong> ${ent.reason}<br><strong>Verantw.:</strong> ${ent.responsible||'N/A'}<br><strong>Bis:</strong> ${dd}</div>${ent.photo?`<img src="${ent.photo}" class="entry-photo">`:''}<div><button class="edit-btn" onclick="editEntry(this)">✏️ Bearbeiten</button><button class="remove-btn" onclick="showCustomConfirmation(this)">🗑️ Löschen</button></div>`;
			return div;
		}

		function editEntry(btn) {
			const ent=btn.closest('.entry-item'); editingEntryId=parseInt(ent.getAttribute('data-id')); currentPerformer=ent.getAttribute('data-performer'); currentReason=ent.getAttribute('data-reason'); currentPhoto=ent.getAttribute('data-photo'); currentResponsible=ent.getAttribute('data-responsible'); currentDueDate=ent.getAttribute('data-duedate');
			if(Array.from(blockedBySelect.options).map(o=>o.value).includes(currentPerformer)){ blockedBySelect.value=currentPerformer; blockedByTextInput.value=''; }else{ blockedBySelect.value=''; blockedByTextInput.value=currentPerformer; }
			if(Array.from(responsibleSelect.options).map(o=>o.value).includes(currentResponsible)){ responsibleSelect.value=currentResponsible; responsibleTextInput.value=''; }else{ responsibleSelect.value=''; responsibleTextInput.value=currentResponsible; }
			handleDateChange(currentDueDate);
			if(currentDueDate){ document.querySelectorAll('.due-date-buttons button').forEach(b=>b.classList.remove('active-btn')); dueDateInput.style.display='none'; dueDateInput.value=''; const td=new Date().toISOString().substring(0,10); if(currentDueDate===td||currentDueDate==='Sofort'){ dueDateDisplay.textContent='Datum: Sofort'; document.querySelector('.due-date-buttons button:nth-child(1)').classList.add('active-btn'); currentDueDate='Sofort'; }else if(currentDueDate===calculateNextWeekFriday()){ dueDateDisplay.textContent=`Datum: Fr. KW ${getWeekNumber(new Date(currentDueDate+'T12:00:00'))} (${formatDate(currentDueDate)})`; document.querySelector('.due-date-buttons button:nth-child(2)').classList.add('active-btn'); }else{ dueDateDisplay.textContent='Datum: '+formatDate(currentDueDate); dueDateInput.style.display='block'; dueDateInput.value=currentDueDate; document.querySelector('.due-date-buttons button:nth-child(3)').classList.add('active-btn'); } }
			const rBtns=document.querySelectorAll('.reason-buttons button');
			if(Array.from(rBtns).map(b=>b.textContent).includes(currentReason)){ customReasonInput.value=''; rBtns.forEach(b=>{if(b.textContent===currentReason) b.classList.add('active-btn'); else b.classList.remove('active-btn');}); hideAllPanels(); document.getElementById('actionSelectionPanel').style.display='block'; }else{ customReasonInput.value=currentReason; currentReason='Sonstiges'; rBtns.forEach(b=>{if(b.textContent==='Sonstiges') b.classList.add('active-btn'); else b.classList.remove('active-btn');}); hideAllPanels(); document.getElementById('actionSelectionPanel').style.display='block'; }
			if(currentPhoto){ const img=new Image(); img.onload=()=>{ let w=img.width, h=img.height; const r=Math.min(1024/w, 768/h); w*=r; h*=r; canvasElement.width=w; canvasElement.height=h; context.drawImage(img,0,0,w,h); canvasElement.style.display='block'; videoElement.style.display='none'; takePhotoButton.style.display='none'; retakePhotoButton.style.display='block'; }; img.src=currentPhoto; }else{ canvasElement.style.display='none'; currentPhoto=null; }
			printAndSaveButton.textContent='Aktualisieren & Abschließen'; updatePrintPreview();
		}

		async function loadEntries() { entriesList.innerHTML=''; const entries=await getAllEntries(); entries.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)); entries.forEach(e=>{ if(currentFilter==='all') entriesList.appendChild(appendEntryToDOM(e)); }); updatePrintPreview(); }
		function filterEntries(f, btn) { currentFilter=f; loadEntries(); document.querySelectorAll('.filter-buttons button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
		function showCustomConfirmation(btn) { deleteAllMode=false; document.getElementById('modalTitle').textContent='Eintrag löschen?'; document.getElementById('modalText').textContent='Möchten Sie diesen Eintrag wirklich entfernen?'; entryToRemove=btn.closest('.entry-item'); confirmationModal.style.display='flex'; }
		confirmYesButton.addEventListener('click', async () => { if(deleteAllMode) { await clearAllEntries(); alert('Alle Einträge wurden erfolgreich gelöscht.'); } else if(entryToRemove) { await deleteEntry(parseInt(entryToRemove.getAttribute('data-id'))); entryToRemove.remove(); entryToRemove=null; } confirmationModal.style.display='none'; loadEntries(); deleteAllMode=false; });
		confirmNoButton.addEventListener('click', () => { entryToRemove=null; deleteAllMode=false; confirmationModal.style.display='none'; });
		window.addEventListener('click', e => { if(e.target==confirmationModal){ entryToRemove=null; deleteAllMode=false; confirmationModal.style.display='none'; }});

		async function updatePrintPreview() {
			const p=blockedByTextInput.value.trim()||blockedBySelect.value.trim()||currentPerformer||'';
			const r=(currentReason==='Sonstiges'?customReasonInput.value.trim():currentReason)||'';
			const resp=responsibleTextInput.value.trim()||responsibleSelect.value.trim()||currentResponsible||'';
			let dd='N/A';
			if(currentDueDate){ const td=new Date().toISOString().substring(0,10); if(currentDueDate==='Sofort'||new Date(currentDueDate).toISOString().substring(0,10)===td) dd='Sofort'; else if(currentDueDate===calculateNextWeekFriday()) dd=`Fr. KW ${getWeekNumber(new Date(currentDueDate+'T12:00:00'))} (${formatDate(currentDueDate)})`; else if(dueDateInput.style.display==='block'&&dueDateInput.value) dd=formatDate(dueDateInput.value); else if(currentDueDate&&currentDueDate!=='Sofort') dd=formatDate(currentDueDate); }
			const dt=new Date().toLocaleString('de-DE', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
			printPreviewContent.innerHTML = `<div style="border: 2px solid #ccc; padding: 10px; background: white; border-radius: 8px;"><b>5S Rundgang</b><br><small>${dt}</small><hr><p><b>Von:</b> ${p}<br><b>Aufgabe:</b> ${r}<br><b>Verantw.:</b> ${resp||'N/A'}<br><b>Bis:</b> ${dd}</p>${currentPhoto?`<img src="${currentPhoto}" style="width:100%; border-radius:5px; margin-top:10px;">`:''}</div>`;
		}

		async function exportJsonHandler() {
			try { const entries=await getAllEntries(); if(!entries.length) return alert('Keine Einträge.');
				const file=new File([new Blob([JSON.stringify(entries,null,2)], {type:'application/json'})], `5S_Rundgang_${new Date().toISOString().substring(0,10)}.json`, {type:'application/json'});
				if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:'5S Rundgang Export', text:'Hier ist der 5S Rundgang.'}); return; }catch(e){} }
				const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); URL.revokeObjectURL(a.href); a.remove();
			} catch(e){ alert("Fehler beim Export."); }
		}

		async function importJsonHandler(e) {
			const file=e.target.files[0]; if(!file) return; const reader=new FileReader();
			reader.onload=async ev=>{ try{ const m=JSON.parse(ev.target.result); if(!Array.isArray(m)) throw new Error(); let c=0; for(const ent of m){ await addEntry({performer:ent.performer, reason:ent.reason, photo:ent.photo, responsible:ent.responsible, dueDate:ent.dueDate, timestamp:ent.timestamp||new Date().toISOString()}); c++; } alert(`${c} Einträge importiert!`); loadEntries(); }catch(err){ alert("Fehler beim Laden."); } e.target.value=''; };
			reader.readAsText(file);
		}

		async function clearAllEntries() {
			return new Promise((resolve, reject) => {
				const transaction = db.transaction([STORE_NAME], 'readwrite');
				const request = transaction.objectStore(STORE_NAME).clear();
				request.onsuccess = () => resolve();
				request.onerror = () => reject(request.error);
			});
		}

		async function deleteAllEntriesHandler() {
			const entries = await getAllEntries();
			if (entries.length === 0) return alert('Es gibt keine Einträge zum Löschen.');
			deleteAllMode = true;
			document.getElementById('modalTitle').textContent = 'Alle Einträge löschen?';
			document.getElementById('modalText').textContent = 'Achtung: Möchten Sie wirklich ALLE Einträge dauerhaft löschen?';
			confirmationModal.style.display = 'flex';
		}
	</script>
</body>
</html>
